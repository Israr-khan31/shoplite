name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - frontend/Dockerfile
          - catalog-service/Dockerfile
          - inventory-service/Dockerfile
          - order-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend,  dir: frontend,          limit_mb: 60 }
          - { name: catalog,   dir: catalog-service,   limit_mb: 200 }
          - { name: inventory, dir: inventory-service, limit_mb: 30 }
          - { name: orders,    dir: order-service,     limit_mb: 300 }
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shop-${{ matrix.name }}:ci ${{ matrix.dir }}
      - name: Check size budget
        run: |
          bytes=$(docker image inspect shop-${{ matrix.name }}:ci --format '{{.Size}}')
          mb=$((bytes / 1000000))
          echo "shop-${{ matrix.name }}: ${mb} MB (limit ${{ matrix.limit_mb }} MB)"
          if [ "$mb" -gt "${{ matrix.limit_mb }}" ]; then
            echo "Image is over its size budget" >&2
            exit 1
          fi
